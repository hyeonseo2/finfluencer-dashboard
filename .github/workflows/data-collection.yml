name: Pages Data Build

on:
  schedule:
    - cron: "0 * * * *" # every hour (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Build docs/data/latest.json
        run: python scripts/build_pages_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/data/latest.json; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git commit -m "chore(data): update pages dataset"
          git push
