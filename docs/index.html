<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>핀플루언서 비교 분석 대시보드 (Pages Mode)</title>
  <style>
    :root { --bg:#f4f7fb; --panel:#fff; --line:#dbe3eb; --text:#111827; --muted:#5b6472; --accent:#3556ff; }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#f6f8fb,#eef3f8);font-family:Pretendard,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
    .top{position:sticky;top:0;background:#0f172a;color:#fff;padding:12px 16px;z-index:10}
    .top h1{margin:0;font-size:22px;text-align:center}
    .top .bar{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
    .top input,.top select{height:34px;border-radius:999px;border:1px solid #334155;background:#0b1220;color:#e5e7eb;padding:0 12px}
    .wrap{max-width:1080px;margin:14px auto;padding:0 12px 40px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 20px rgba(15,23,42,.08)}
    .muted{color:var(--muted);font-size:13px}
    .list{display:grid;gap:10px;margin-top:10px}
    .item{display:grid;grid-template-columns:220px 1fr;gap:12px;padding:10px;border:1px solid #e6ebf2;border-radius:12px;background:#fff}
    .thumb{width:220px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#e5e7eb}
    .title{font-weight:800;font-size:16px;line-height:1.3}
    .meta{font-size:12px;color:#64748b;margin-top:4px}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .pill{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid #d9e2f3;background:#f8fbff}
    .stance-positive{background:#ebfff3;border-color:#98e2b0;color:#166534}
    .stance-neutral{background:#eff6ff;border-color:#b6d2ff;color:#1e3a8a}
    .stance-negative{background:#fff1f2;border-color:#fecdd3;color:#9f1239}
    @media (max-width:900px){.item{grid-template-columns:1fr}.thumb{width:100%}}
  </style>
</head>
<body>
  <header class="top">
    <h1>핀플루언서 비교 분석 대시보드</h1>
    <div class="bar">
      <select id="topicFilter"></select>
      <input id="query" placeholder="검색어 입력" />
    </div>
  </header>

  <main class="wrap">
    <div class="panel">
      <div class="muted" id="status">데이터 로딩 중...</div>
      <div id="list" class="list"></div>
    </div>
  </main>

  <script>
    let dataset = { videos: [], topics: [] };

    function stanceLabel(s){ return s==='positive'?'긍정':s==='negative'?'부정':'중립'; }
    function stanceClass(s){ return s==='positive'?'stance-positive':s==='negative'?'stance-negative':'stance-neutral'; }

    function render() {
      const q = (document.getElementById('query').value || '').trim().toLowerCase();
      const topic = document.getElementById('topicFilter').value;
      const list = document.getElementById('list');
      const status = document.getElementById('status');

      let rows = (dataset.videos || []).filter(v => {
        const okTopic = !topic || topic === 'all' || (v.topics||[]).includes(topic);
        const okQ = !q || (v.title||'').toLowerCase().includes(q) || (v.channel_name||'').toLowerCase().includes(q);
        return okTopic && okQ;
      });

      status.textContent = `업데이트: ${dataset.generated_at || '-'} · ${rows.length}개 영상`;
      list.innerHTML = '';
      rows.slice(0, 120).forEach(v => {
        const el = document.createElement('article');
        el.className = 'item';
        const thumb = v.thumbnail_url || '';
        el.innerHTML = `
          <a href="${v.source_url}" target="_blank" rel="noreferrer">
            <img class="thumb" src="${thumb}" alt="thumb" />
          </a>
          <div>
            <a class="title" href="${v.source_url}" target="_blank" rel="noreferrer">${v.title || '(제목 없음)'}</a>
            <div class="meta">${v.channel_name || ''} · ${v.published_at || ''}</div>
            <div class="tags">
              ${(v.topic_stances||[]).map(x => `<span class="pill ${stanceClass(x.stance)}">${x.topic} ${stanceLabel(x.stance)}</span>`).join('')}
            </div>
          </div>`;
        list.appendChild(el);
      });
    }

    async function init() {
      const res = await fetch('./data/latest.json', { cache: 'no-store' });
      dataset = await res.json();

      const tf = document.getElementById('topicFilter');
      tf.innerHTML = `<option value="all">전체 토픽</option>` + (dataset.topics || []).map(t => `<option value="${t}">${t}</option>`).join('');
      tf.onchange = render;
      document.getElementById('query').oninput = render;

      render();
    }

    init().catch((e) => {
      document.getElementById('status').textContent = `데이터 로드 실패: ${e.message}`;
    });
  </script>
</body>
</html>
