<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>핀플루언서 비교 분석 대시보드</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
    }

    .iframe-wrap {
      position: fixed;
      inset: 0;
    }

    #dashboard-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }

    .fallback {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 10;
      margin: 0;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.84);
      border: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(4px);
    }

    .fallback a {
      color: #93c5fd;
      font-weight: 600;
      text-underline-offset: 2px;
    }

    .fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="iframe-wrap">
    <iframe
      id="dashboard-frame"
      title="핀플루언서 비교 분석 대시보드"
      src="https://finfluencer-mvp-api-415500942280.asia-northeast3.run.app/"
      loading="eager"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <p id="fallback" class="fallback" hidden>
    대시보드가 보이지 않으면
    <a href="https://finfluencer-mvp-api-415500942280.asia-northeast3.run.app/" target="_blank" rel="noopener noreferrer">여기에서 바로 열기</a>
  </p>

  <noscript>
    <p class="fallback">
      브라우저에서 스크립트를 사용할 수 없어 임베드가 제한됩니다.
      <a href="https://finfluencer-mvp-api-415500942280.asia-northeast3.run.app/" target="_blank" rel="noopener noreferrer">대시보드 바로가기</a>
    </p>
  </noscript>

  <script>
    (function () {
      const frame = document.getElementById("dashboard-frame");
      const fallback = document.getElementById("fallback");
      let loaded = false;

      const showFallback = function () {
        fallback.hidden = false;
      };

      const hideFallback = function () {
        fallback.hidden = true;
      };

      const timeoutId = window.setTimeout(function () {
        if (!loaded) {
          showFallback();
        }
      }, 5000);

      frame.addEventListener("load", function () {
        loaded = true;
        window.clearTimeout(timeoutId);
        hideFallback();
      });

      frame.addEventListener("error", function () {
        window.clearTimeout(timeoutId);
        showFallback();
      });
    })();
  </script>
</body>
</html>
