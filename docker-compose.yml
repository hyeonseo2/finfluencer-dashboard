version: '3.8'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: finfluencer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finfluencer"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.workers.runner
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  poller:
    build: .
    command: python -m app.workers.poller
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
